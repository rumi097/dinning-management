# =============================================
# PRODUCTION CONFIGURATION
# =============================================
# Override these via environment variables on the server:
#   DATABASE_URL (Render provides this automatically for linked databases)
#   JWT_SECRET, ADMIN_PASSWORD
#   SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD

spring.application.name=backend

# ---- Database ----
# RenderDatabaseUrlSupport converts Render's DATABASE_URL (postgres://user:pass@host:5432/db)
# to a JDBC URL at startup.
# These fallback values are only used if DATABASE_URL env var is not set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dsiApp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

server.servlet.context-path=/api/v1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.dsi.ruet.backend=INFO

# ---- Mail ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:aliazgorrumi@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:axehodbqxenvfulz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SPRING_MAIL_USERNAME:aliazgorrumi@gmail.com}

# ---- JWT ----
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm}
jwt.expiration=86400000

# ---- Admin ----
admin.email=admin@dsi.ruet.ac.bd
admin.password=${ADMIN_PASSWORD:admin@ruet2024}

# ---- Server ----
server.port=${PORT:8080}
