services:
  - type: web
    name: dsi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dsi-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin@ruet2024
      - key: SPRING_MAIL_USERNAME
        sync: false  # Your Gmail address
      - key: SPRING_MAIL_PASSWORD
        sync: false  # Your Gmail App Password
      - key: PORT
        value: "8080"

databases:
  - name: dsi-postgres
    plan: free
    databaseName: dsiApp
    user: dsiuser
